<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f7f0; }
        .navbar { background-color: #2e7d32; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-success { background-color: #2e7d32; border-color: #2e7d32; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">
        <i class="bi bi-flower1"></i> Akıllı Tarım Yönetim Paneli
    </span>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left"></i> Dashboard'a Dön
    </a>
</nav>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h5 class="fw-bold mb-4">
                    <i class="bi bi-plus-circle text-success"></i> Manuel Sensör Verisi Ekle
                </h5>

                <form method="post">
    {% csrf_token %}

    {% if hata %}
    <div class="alert alert-danger">{{ hata }}</div>
    {% endif %}

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cihaz ID</label>
                        <input type="text" name="device_id" class="form-control"
                               placeholder="Örn: sensor-01" required>
                        <div class="form-text">Sensörün benzersiz kimlik numarası</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-thermometer-half text-danger"></i> Sıcaklık (°C)
                        </label>
                        <input type="number" name="temperature" step="0.1"
                               class="form-control" placeholder="Örn: 24.5" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-cloud text-info"></i> Hava Nemi (%)
                        </label>
                        <input type="number" name="humidity" step="0.1" min="0" max="100"
                               class="form-control" placeholder="Örn: 65.0" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-droplet-half text-primary"></i> Toprak Nemi (%)
                        </label>
                        <input type="number" name="soil_moisture" step="0.1" min="0" max="100"
                               class="form-control" placeholder="Örn: 45.0" required>
                        <div class="form-text text-danger">
                            <i class="bi bi-exclamation-triangle"></i>
                            %30'un altındaki değerler sulama uyarısı tetikler!
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Kaydet
                        </button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">
                            İptal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
